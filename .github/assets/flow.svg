<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="VeritasChain pipeline: file, SHA-256 hash, IPFS pin, Ethereum anchor, certificate">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C0F"/>
      <stop offset="100%" stop-color="#131217"/>
    </linearGradient>
    <linearGradient id="fgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D08A"/>
      <stop offset="100%" stop-color="#8C6F2A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9A84C"/>
    </marker>
  </defs>

  <rect width="1100" height="330" rx="14" fill="url(#fbg)"/>

  <!-- rail -->
  <line x1="120" y1="150" x2="980" y2="150" stroke="#3A3423" stroke-width="2"/>
  <g stroke="#C9A84C" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <path d="M150 150 H 255"/><path d="M355 150 H 460"/>
    <path d="M560 150 H 665"/><path d="M765 150 H 870"/>
  </g>

  <!-- travelling payload -->
  <circle r="6" fill="#F6E9BC">
    <animate attributeName="opacity" values="0;1;1;1;0" dur="6s" repeatCount="indefinite"/>
    <animateMotion dur="6s" repeatCount="indefinite" path="M120,150 H 980"/>
  </circle>

  <g font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1 FILE -->
    <g transform="translate(120,150)">
      <rect x="-32" y="-40" width="64" height="80" rx="8" fill="none" stroke="url(#fgold)" stroke-width="2"/>
      <g stroke="#6E6656" stroke-width="3" stroke-linecap="round">
        <path d="M-16 -16 H 16"/><path d="M-16 0 H 16"/><path d="M-16 16 H 4"/>
      </g>
      <text y="68" font-size="14" fill="#E8D08A" letter-spacing="3">FILE</text>
      <text y="88" font-size="11" fill="#6E6656">any format</text>
    </g>

    <!-- 2 SHA-256 -->
    <g transform="translate(305,150)">
      <circle r="42" fill="none" stroke="url(#fgold)" stroke-width="2"/>
      <circle r="42" fill="none" stroke="#F6E9BC" stroke-width="2" stroke-dasharray="14 250" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text y="5" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#F6E9BC">HASH</text>
      <text y="68" font-size="14" fill="#E8D08A" letter-spacing="3">FINGERPRINT</text>
      <text y="88" font-size="11" fill="#6E6656">content-addressed</text>
    </g>

    <!-- 3 IPFS -->
    <g transform="translate(510,150)">
      <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="url(#fgold)" stroke-width="2"/>
      <g fill="#C9A84C">
        <circle cx="0" cy="-18" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="-16" cy="10" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="16" cy="10" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
      </g>
      <g stroke="#6E6656" stroke-width="1.2"><path d="M0 -18 L-16 10 L16 10 Z" fill="none"/></g>
      <text y="70" font-size="14" fill="#E8D08A" letter-spacing="3">IPFS</text>
      <text y="90" font-size="11" fill="#6E6656">content-addressed CID</text>
    </g>

    <!-- 4 ETHEREUM -->
    <g transform="translate(715,150)">
      <polygon points="0,-46 28,0 0,18 -28,0" fill="none" stroke="url(#fgold)" stroke-width="2"/>
      <polygon points="0,28 28,8 0,46 -28,8" fill="none" stroke="url(#fgold)" stroke-width="2"/>
      <polygon points="0,-46 28,0 0,18 -28,0" fill="#C9A84C" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
      </polygon>
      <text y="70" font-size="14" fill="#E8D08A" letter-spacing="3">ETHEREUM</text>
      <text y="90" font-size="11" fill="#6E6656">hash · wallet · timestamp</text>
    </g>

    <!-- 5 CERTIFICATE -->
    <g transform="translate(920,150)">
      <rect x="-40" y="-36" width="80" height="72" rx="8" fill="none" stroke="url(#fgold)" stroke-width="2"/>
      <path d="M-18 0 l12 12 l24 -26" fill="none" stroke="#F6E9BC" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="60" stroke-dashoffset="60">
        <animate attributeName="stroke-dashoffset" values="60;60;0;0" keyTimes="0;0.55;0.8;1" dur="6s" repeatCount="indefinite"/>
      </path>
      <text y="64" font-size="14" fill="#E8D08A" letter-spacing="3">PROOF</text>
      <text y="84" font-size="11" fill="#6E6656">shareable forever</text>
    </g>
  </g>

  <text x="550" y="300" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace"
        font-size="12" letter-spacing="2" fill="#5A5446">
    immutable · permissionless · no accounts · wallet-bound
  </text>
</svg>
